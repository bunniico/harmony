services:
  harmony:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.json:/app/config.json:ro
      - ./persona:/app/persona:ro
      - harmony-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach adderall on the host's port 8000

volumes:
  harmony-data:
